name: Deploy PowerShell training to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Regenerate chapter cards, homepage and quizzes
        run: |
          node scripts/generate-quizzes.mjs content
          node scripts/generate-homepage.mjs content --from-template
          node scripts/generate-explorer-chapters.mjs

      - name: Validate public content before deployment
        run: node scripts/validate-publication.mjs content

      - name: Fix folder-page links in the local graph
        run: node scripts/fix-quartz-graph.mjs

      - name: Build Quartz
        run: node quartz/bootstrap-cli.mjs build

      - name: Publish interactive HTML pages
        run: |
          find content -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            relative_path="${file#content/}"
            mkdir -p "public/$(dirname "$relative_path")"
            cp "$file" "public/$relative_path"
          done

      - name: Publish quiz assets with original names
        run: |
          test -f content/assets/quiz/quiz.css
          test -f content/assets/quiz/quiz-engine.js
          test -d content/assets/quiz/quiz-banks
          mkdir -p public/assets/quiz
          cp content/assets/quiz/quiz.css public/assets/quiz/quiz.css
          cp content/assets/quiz/quiz-engine.js public/assets/quiz/quiz-engine.js
          cp -R content/assets/quiz/quiz-banks public/assets/quiz/
          expected="$(find content/cours/quiz -maxdepth 1 -type f -name '*.html' | wc -l)"
          banks="$(find content/assets/quiz/quiz-banks -maxdepth 1 -type f -name '*.js' | wc -l)"
          actual="$(find content/cours -mindepth 1 -maxdepth 1 -type d -name '[0-9][0-9]-*' | wc -l)"
          test "$expected" -eq "$actual"
          test "$banks" -eq "$actual"

      - name: Publish Markdown downloads
        run: |
          mkdir -p public/telechargements
          find content -type f -name "*.md" ! -name "index.md" -print0 | while IFS= read -r -d '' file; do
            relative_path="${file#content/}"
            mkdir -p "public/telechargements/$(dirname "$relative_path")"
            cp "$file" "public/telechargements/$relative_path"
          done

      - name: Create Obsidian archive when course content exists
        run: |
          course_count="$(find content/cours -type f -name '*.md' 2>/dev/null | wc -l)"
          if [ "$course_count" -gt 0 ]; then
            mkdir -p download/PowerShell
            cp -R content/. download/PowerShell/
            rm -f download/PowerShell/index.md
            cd download
            zip -qr ../public/powershell-obsidian.zip PowerShell
          fi

      - name: Verify downloadable Obsidian archive
        run: |
          test -s public/powershell-obsidian.zip
          unzip -tqq public/powershell-obsidian.zip

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
