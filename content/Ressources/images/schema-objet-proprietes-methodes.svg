<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">Anatomie d'un objet PowerShell</title>
  <desc id="desc">Une commande PowerShell produit un objet structuré. Ses propriétés décrivent ses informations et se lisent sans parenthèses. Ses méthodes représentent des actions et s'exécutent avec des parenthèses. Get-Member permet de découvrir les membres disponibles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#162b43"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#77d9f6"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#55dfc9"/>
    </marker>
  </defs>

  <rect width="960" height="610" rx="24" fill="url(#background)"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="36" y="48" fill="#f4f8ff" font-size="27" font-weight="700">Un objet PowerShell : des informations et des actions</text>
    <text x="36" y="78" fill="#acc3d9" font-size="15">La commande ne renvoie pas une simple ligne de texte : elle produit une structure que PowerShell sait manipuler.</text>

    <!-- Source -->
    <rect x="36" y="118" width="210" height="104" rx="15" fill="#203d63" stroke="#62b8ed" stroke-width="2"/>
    <text x="54" y="151" fill="#8fddfa" font-size="13" font-weight="700">COMMANDE</text>
    <text x="54" y="181" fill="#ffffff" font-size="20" font-weight="700">Get-Item</text>
    <text x="54" y="205" fill="#d1e5f5" font-size="14">notepad.exe</text>

    <!-- Object -->
    <rect x="350" y="108" width="260" height="124" rx="18" fill="#49417a" stroke="#b5a0ff" stroke-width="3"/>
    <circle cx="390" cy="150" r="21" fill="#b5a0ff" opacity=".2"/>
    <path d="M378 150h24M390 138v24" stroke="#dcd2ff" stroke-width="3" stroke-linecap="round"/>
    <text x="425" y="149" fill="#ffffff" font-size="25" font-weight="700">OBJET</text>
    <text x="425" y="178" fill="#e8e2ff" font-size="15">System.IO.FileInfo</text>
    <text x="372" y="210" fill="#d2c9ff" font-size="14">Une valeur + un type + des membres</text>

    <path d="M252 170H337" fill="none" stroke="#77d9f6" stroke-width="4" marker-end="url(#arrow-cyan)"/>
    <text x="267" y="154" fill="#77d9f6" font-size="13" font-weight="700">produit</text>

    <!-- Properties -->
    <rect x="76" y="304" width="342" height="188" rx="18" fill="#174441" stroke="#55dfc9" stroke-width="2"/>
    <text x="98" y="340" fill="#70ead7" font-size="14" font-weight="700">PROPRIÉTÉS · INFORMATIONS</text>
    <text x="98" y="372" fill="#ffffff" font-size="20" font-weight="700">On les lit</text>
    <text x="98" y="402" fill="#d8f9f2" font-size="15">Name → notepad.exe</text>
    <text x="98" y="428" fill="#d8f9f2" font-size="15">Length → taille en octets</text>
    <text x="98" y="454" fill="#d8f9f2" font-size="15">LastWriteTime → date</text>
    <rect x="238" y="354" width="155" height="42" rx="9" fill="#092725"/>
    <text x="252" y="381" fill="#baf8eb" font-family="Consolas, monospace" font-size="14">$objet.Name</text>

    <!-- Methods -->
    <rect x="542" y="304" width="342" height="188" rx="18" fill="#59354a" stroke="#ff8eaa" stroke-width="2"/>
    <text x="564" y="340" fill="#ff9db4" font-size="14" font-weight="700">MÉTHODES · ACTIONS</text>
    <text x="564" y="372" fill="#ffffff" font-size="20" font-weight="700">On les exécute</text>
    <text x="564" y="402" fill="#ffe0e7" font-size="15">CopyTo() → copier</text>
    <text x="564" y="428" fill="#ffe0e7" font-size="15">Delete() → supprimer</text>
    <text x="564" y="454" fill="#ffe0e7" font-size="15">ToString() → représenter en texte</text>
    <rect x="706" y="354" width="153" height="42" rx="9" fill="#2c1320"/>
    <text x="720" y="381" fill="#ffd0dc" font-family="Consolas, monospace" font-size="14">$objet.Delete()</text>

    <path d="M421 232C397 261 336 269 272 294" fill="none" stroke="#55dfc9" stroke-width="3" marker-end="url(#arrow-mint)"/>
    <path d="M539 232C563 261 624 269 688 294" fill="none" stroke="#ff8eaa" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <text x="172" y="520" fill="#70ead7" font-size="15" font-weight="700">Sans parenthèses</text>
    <text x="663" y="520" fill="#ff9db4" font-size="15" font-weight="700">Avec parenthèses ()</text>

    <!-- Discovery footer -->
    <rect x="36" y="548" width="888" height="38" rx="11" fill="#0a1524" stroke="#ffc66f" stroke-width="1.5"/>
    <text x="55" y="573" fill="#ffc66f" font-size="15" font-weight="700">Explorer :</text>
    <text x="133" y="573" fill="#f4f8ff" font-family="Consolas, monospace" font-size="14">$objet | Get-Member</text>
    <text x="322" y="573" fill="#acc3d9" font-size="14">→ révèle son type, ses propriétés et ses méthodes</text>
    <text x="730" y="573" fill="#8fddfa" font-size="14" font-weight="700">Le point . donne accès aux membres</text>
  </g>
</svg>
