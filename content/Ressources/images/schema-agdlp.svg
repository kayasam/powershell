<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/><stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="url(#bg)" rx="15"/>

  <!-- Titre -->
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Modele AGDLP — Comment les droits arrivent jusqu'a l'utilisateur</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#888">Account → Global → DomainLocal → Permission</text>

  <!-- === LIGNE DU HAUT : LES 4 LETTRES === -->

  <!-- A = Account -->
  <rect x="30" y="90" width="220" height="100" rx="15" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#sh)"/>
  <text x="140" y="118" text-anchor="middle" font-size="28" font-weight="bold" fill="#1565C0">A</text>
  <text x="140" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Account</text>
  <text x="140" y="158" text-anchor="middle" font-size="11" fill="#555">Le compte utilisateur</text>
  <text x="140" y="175" text-anchor="middle" font-size="10" fill="#888">Ex: mlebrun</text>

  <!-- Flèche A → G -->
  <line x1="250" y1="140" x2="295" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="273" y="132" text-anchor="middle" font-size="10" fill="#555">membre de</text>

  <!-- G = Global -->
  <rect x="300" y="90" width="220" height="100" rx="15" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#sh)"/>
  <text x="410" y="118" text-anchor="middle" font-size="28" font-weight="bold" fill="#2E7D32">G</text>
  <text x="410" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Global Group</text>
  <text x="410" y="158" text-anchor="middle" font-size="11" fill="#555">Regroupe par fonction</text>
  <text x="410" y="175" text-anchor="middle" font-size="10" fill="#888">Ex: G_Labo_fab_boulangerie</text>

  <!-- Flèche G → DL -->
  <line x1="520" y1="140" x2="565" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="543" y="132" text-anchor="middle" font-size="10" fill="#555">membre de</text>

  <!-- DL = DomainLocal -->
  <rect x="570" y="90" width="220" height="100" rx="15" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#sh)"/>
  <text x="680" y="118" text-anchor="middle" font-size="28" font-weight="bold" fill="#E65100">DL</text>
  <text x="680" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">DomainLocal Group</text>
  <text x="680" y="158" text-anchor="middle" font-size="11" fill="#555">Lie a une ressource</text>
  <text x="680" y="175" text-anchor="middle" font-size="10" fill="#888">Ex: DL_..._boulangerie_M</text>

  <!-- Flèche DL → P -->
  <line x1="790" y1="140" x2="835" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="813" y="132" text-anchor="middle" font-size="10" fill="#555">a le droit</text>

  <!-- P = Permission -->
  <rect x="840" y="90" width="230" height="100" rx="15" fill="#FCE4EC" stroke="#C62828" stroke-width="2" filter="url(#sh)"/>
  <text x="955" y="118" text-anchor="middle" font-size="28" font-weight="bold" fill="#C62828">P</text>
  <text x="955" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">Permission NTFS</text>
  <text x="955" y="158" text-anchor="middle" font-size="11" fill="#555">Le droit sur le dossier</text>
  <text x="955" y="175" text-anchor="middle" font-size="10" fill="#888">Ex: Modification sur C:\...\boulangerie</text>

  <!-- === EXEMPLE CONCRET : MARC LEBRUN === -->

  <rect x="30" y="220" width="1040" height="380" rx="12" fill="white" stroke="#DDD" filter="url(#sh)"/>
  <text x="550" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Exemple concret : Marc Lebrun (Chef Boulanger)</text>

  <!-- Marc (Account) -->
  <rect x="60" y="275" width="170" height="55" rx="25" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="145" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">mlebrun</text>
  <text x="145" y="315" text-anchor="middle" font-size="10" fill="#555">Chef Boulanger</text>

  <!-- Flèche vers G_boulangerie -->
  <line x1="230" y1="302" x2="270" y2="302" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- G_boulangerie -->
  <rect x="275" y="275" width="280" height="55" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="415" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">G_Laboratoire_fabrication_boulangerie</text>
  <text x="415" y="315" text-anchor="middle" font-size="9" fill="#888">Groupe Global — regroupe les boulangers</text>

  <!-- Flèche vers DL_M -->
  <line x1="555" y1="302" x2="600" y2="302" stroke="#E65100" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DL_boulangerie_M -->
  <rect x="605" y="275" width="300" height="55" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="755" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">DL_Labo_fab_boulangerie_M</text>
  <text x="755" y="315" text-anchor="middle" font-size="9" fill="#888">DomainLocal — Modification</text>

  <!-- Flèche vers dossier -->
  <line x1="905" y1="302" x2="945" y2="302" stroke="#C62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Permission -->
  <rect x="950" y="282" width="110" height="40" rx="8" fill="#FCE4EC" stroke="#C62828"/>
  <text x="1005" y="307" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Modification</text>

  <!-- Résultat : le dossier -->
  <text x="1005" y="338" text-anchor="middle" font-size="9" fill="#888">C:\fournil\...\boulangerie</text>

  <!-- === Niveaux parents (lecture) === -->
  <text x="60" y="365" font-size="12" font-weight="bold" fill="#666">Niveaux parents (herites automatiquement) :</text>

  <!-- Niveau fabrication -->
  <rect x="275" y="380" width="280" height="40" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="415" y="405" text-anchor="middle" font-size="10" fill="#2E7D32">G_Laboratoire_fabrication</text>
  <line x1="555" y1="400" x2="600" y2="400" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <rect x="605" y="380" width="300" height="40" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="755" y="405" text-anchor="middle" font-size="10" fill="#E65100">DL_Labo_fabrication_L → Lecture</text>

  <!-- Niveau Laboratoire -->
  <rect x="275" y="430" width="280" height="40" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="415" y="455" text-anchor="middle" font-size="10" fill="#2E7D32">G_Laboratoire</text>
  <line x1="555" y1="450" x2="600" y2="450" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <rect x="605" y="430" width="300" height="40" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="755" y="455" text-anchor="middle" font-size="10" fill="#E65100">DL_Laboratoire_L → Lecture</text>

  <!-- Niveau fournil -->
  <rect x="275" y="480" width="280" height="40" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="415" y="505" text-anchor="middle" font-size="10" fill="#2E7D32">G_fournil</text>
  <line x1="555" y1="500" x2="600" y2="500" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <rect x="605" y="480" width="300" height="40" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="755" y="505" text-anchor="middle" font-size="10" fill="#E65100">DL_fournil_L → Lecture</text>

  <!-- Légende en bas -->
  <text x="60" y="550" font-size="11" fill="#555">Resultat : mlebrun peut</text>
  <text x="60" y="568" font-size="11" font-weight="bold" fill="#2E7D32">MODIFIER</text>
  <text x="130" y="568" font-size="11" fill="#555">les fichiers de boulangerie, mais seulement</text>
  <text x="420" y="568" font-size="11" font-weight="bold" fill="#E65100">LIRE</text>
  <text x="450" y="568" font-size="11" fill="#555">ceux de fabrication, Laboratoire et fournil.</text>

  <text x="60" y="592" font-size="10" fill="#AAA">On ne donne JAMAIS de permissions directement a un utilisateur. Toujours : A → G → DL → P</text>
</svg>
