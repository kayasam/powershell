<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/><stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/></filter>
    <marker id="aP" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6A1B9A"/></marker>
    <marker id="aB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/></marker>
    <marker id="aO" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#EF6C00"/></marker>
    <marker id="aG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/></marker>
  </defs>

  <rect width="1180" height="860" fill="url(#bg)" rx="15"/>

  <text x="590" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Les flux du TP &#8212; pourquoi on ouvre chaque port du pare-feu</text>
  <text x="590" y="62" text-anchor="middle" font-size="13" fill="#888">Un pare-feu bloque par defaut. Chaque regle qu'on cree correspond a une fleche ci-dessous.</text>

  <rect x="40" y="110" width="200" height="330" rx="14" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5" filter="url(#sh)"/>
  <text x="140" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A1B9A">VOTRE POSTE</text>
  <text x="140" y="157" text-anchor="middle" font-size="11" fill="#666">192.168.3.50</text>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#555">VSCode</text>
  <text x="140" y="199" text-anchor="middle" font-size="11" fill="#555">Remote-SSH</text>
  <text x="140" y="420" text-anchor="middle" font-size="10" fill="#888">client uniquement</text>

  <rect x="470" y="110" width="220" height="330" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5" filter="url(#sh)"/>
  <text x="580" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">DC01</text>
  <text x="580" y="157" text-anchor="middle" font-size="11" fill="#666">192.168.3.1</text>
  <text x="580" y="182" text-anchor="middle" font-size="11" fill="#555">AD DS &#183; DNS</text>
  <text x="580" y="199" text-anchor="middle" font-size="11" fill="#555">DFS-N &#183; DFS-R</text>
  <text x="580" y="420" text-anchor="middle" font-size="10" fill="#888">serveur + client de DC02</text>

  <rect x="930" y="110" width="210" height="330" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5" filter="url(#sh)"/>
  <text x="1035" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">DC02</text>
  <text x="1035" y="157" text-anchor="middle" font-size="11" fill="#666">192.168.3.2</text>
  <text x="1035" y="182" text-anchor="middle" font-size="11" fill="#555">Partages caches</text>
  <text x="1035" y="199" text-anchor="middle" font-size="11" fill="#555">Cible DFS</text>
  <text x="1035" y="420" text-anchor="middle" font-size="10" fill="#888">serveur uniquement</text>

  <line x1="240" y1="250" x2="465" y2="250" stroke="#6A1B9A" stroke-width="3" marker-end="url(#aP)"/>
  <rect x="258" y="218" width="190" height="26" rx="6" fill="#6A1B9A"/>
  <text x="353" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">TCP 22 &#8212; SSH</text>
  <text x="353" y="266" text-anchor="middle" font-size="10.5" fill="#6A1B9A">pour que VSCode ouvre un terminal</text>
  <text x="353" y="281" text-anchor="middle" font-size="10.5" fill="#6A1B9A">PowerShell sur DC01</text>

  <line x1="240" y1="350" x2="465" y2="350" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aP)"/>
  <rect x="270" y="320" width="166" height="24" rx="6" fill="#fff" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="353" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A1B9A">ICMP &#8212; ping</text>
  <text x="353" y="371" text-anchor="middle" font-size="10.5" fill="#6A1B9A">diagnostic : est-ce que la</text>
  <text x="353" y="386" text-anchor="middle" font-size="10.5" fill="#6A1B9A">machine repond ?</text>

  <line x1="690" y1="205" x2="925" y2="205" stroke="#1565C0" stroke-width="3" marker-end="url(#aB)"/>
  <rect x="700" y="173" width="212" height="26" rx="6" fill="#1565C0"/>
  <text x="806" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">TCP 5985 &#8212; WinRM</text>
  <text x="806" y="221" text-anchor="middle" font-size="10.5" fill="#1565C0">Invoke-Command : executer du</text>
  <text x="806" y="236" text-anchor="middle" font-size="10.5" fill="#1565C0">PowerShell sur DC02 sans s'y connecter</text>

  <line x1="690" y1="278" x2="925" y2="278" stroke="#EF6C00" stroke-width="3" marker-end="url(#aO)"/>
  <rect x="700" y="246" width="212" height="26" rx="6" fill="#EF6C00"/>
  <text x="806" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">TCP 445 &#8212; SMB</text>
  <text x="806" y="294" text-anchor="middle" font-size="10.5" fill="#EF6C00">les partages \\DC02\Labo$, SYSVOL,</text>
  <text x="806" y="309" text-anchor="middle" font-size="10.5" fill="#EF6C00">les homes H: et Robocopy</text>

  <line x1="690" y1="351" x2="925" y2="351" stroke="#2E7D32" stroke-width="3" marker-end="url(#aG)"/>
  <rect x="700" y="319" width="212" height="26" rx="6" fill="#2E7D32"/>
  <text x="806" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">TCP 135 + 49152-65535</text>
  <text x="806" y="367" text-anchor="middle" font-size="10.5" fill="#2E7D32">RPC : la console DFS et la replication</text>
  <text x="806" y="382" text-anchor="middle" font-size="10.5" fill="#2E7D32">DFS-R negocient un port au hasard</text>

  <line x1="690" y1="412" x2="925" y2="412" stroke="#555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  <text x="806" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">ICMP &#8212; ping</text>

  <rect x="40" y="480" width="555" height="175" rx="12" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" filter="url(#sh)"/>
  <text x="317" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#EF6C00">Pourquoi une plage de 16 000 ports (49152-65535) ?</text>
  <text x="62" y="534" font-size="11.5" fill="#333">DFS et la replication n'utilisent pas un port fixe. Le client demande</text>
  <text x="62" y="554" font-size="11.5" fill="#333">d'abord au <tspan font-weight="bold">port 135</tspan> (l'annuaire RPC) : sur quel port ecoute DFS ?</text>
  <text x="62" y="574" font-size="11.5" fill="#333">Le serveur repond un numero tire au hasard dans la plage haute.</text>
  <text x="62" y="594" font-size="11.5" fill="#333">Le client se reconnecte alors sur ce port la.</text>
  <rect x="62" y="606" width="511" height="34" rx="6" fill="#fff" stroke="#EF6C00" stroke-width="1"/>
  <text x="317" y="628" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#EF6C00">Si on n'ouvre que le 135 : la console DFS affiche erreur generale.</text>

  <rect x="625" y="480" width="515" height="175" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#sh)"/>
  <text x="882" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Pourquoi -Profile Domain et pas tout ouvrir ?</text>
  <text x="648" y="534" font-size="11.5" fill="#333">Windows a 3 pare-feux en un : Domaine, Prive, Public.</text>
  <text x="648" y="554" font-size="11.5" fill="#333">Une regle -Profile Domain ne s'active que si la carte reseau</text>
  <text x="648" y="574" font-size="11.5" fill="#333">est authentifiee aupres du DC (DomainAuthenticated).</text>
  <text x="648" y="594" font-size="11.5" fill="#333">Branchez le serveur sur un autre reseau : les ports se referment.</text>
  <rect x="648" y="606" width="470" height="34" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1"/>
  <text x="882" y="628" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1565C0">Verifiez d'abord : Get-NetConnectionProfile</text>

  <rect x="40" y="685" width="1100" height="145" rx="12" fill="#fff" stroke="#BDBDBD" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="685" width="1100" height="32" rx="12" fill="#37474F"/>
  <rect x="40" y="702" width="1100" height="15" fill="#37474F"/>
  <text x="70" y="707" font-size="12" font-weight="bold" fill="#fff">PORT</text>
  <text x="215" y="707" font-size="12" font-weight="bold" fill="#fff">SENS DU FLUX</text>
  <text x="470" y="707" font-size="12" font-weight="bold" fill="#fff">SERVICE</text>
  <text x="640" y="707" font-size="12" font-weight="bold" fill="#fff">SI CE PORT EST FERME, VOUS VERREZ...</text>

  <text x="70" y="740" font-size="11.5" font-weight="bold" fill="#6A1B9A">22</text>
  <text x="215" y="740" font-size="11.5" fill="#333">Poste &#8594; DC01</text>
  <text x="470" y="740" font-size="11.5" fill="#333">SSH</text>
  <text x="640" y="740" font-size="11.5" fill="#C62828">VSCode : Could not establish connection</text>

  <text x="70" y="763" font-size="11.5" font-weight="bold" fill="#1565C0">5985</text>
  <text x="215" y="763" font-size="11.5" fill="#333">DC01 &#8594; DC02</text>
  <text x="470" y="763" font-size="11.5" fill="#333">WinRM</text>
  <text x="640" y="763" font-size="11.5" fill="#C62828">WinRM cannot complete the operation</text>

  <text x="70" y="786" font-size="11.5" font-weight="bold" fill="#EF6C00">445</text>
  <text x="215" y="786" font-size="11.5" fill="#333">DC01 &#8656;&#8658; DC02</text>
  <text x="470" y="786" font-size="11.5" fill="#333">SMB</text>
  <text x="640" y="786" font-size="11.5" fill="#C62828">Le chemin reseau n'a pas ete trouve sur \\DC02\...</text>

  <text x="70" y="809" font-size="11.5" font-weight="bold" fill="#2E7D32">135 + 49152-65535</text>
  <text x="215" y="809" font-size="11.5" fill="#333">DC01 &#8656;&#8658; DC02</text>
  <text x="470" y="809" font-size="11.5" fill="#333">RPC / DFS-R</text>
  <text x="640" y="809" font-size="11.5" fill="#C62828">DFS : erreur generale &#183; replication bloquee a 0%</text>
</svg>
