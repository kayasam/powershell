<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/><stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/></filter>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker>
  </defs>

  <rect width="1180" height="700" fill="url(#bg)" rx="15"/>

  <text x="590" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#333">Par ou je commence ? &#8212; le parcours complet du TP Le Fournil</text>
  <text x="590" y="65" text-anchor="middle" font-size="13" fill="#888">Suivez les etapes de gauche a droite. On ne saute pas une etape : chacune utilise la precedente.</text>

  <!-- ETAPE 0 : LE MONTAGE -->
  <rect x="40" y="105" width="245" height="150" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="72" cy="137" r="18" fill="#EF6C00"/>
  <text x="72" y="144" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">0</text>
  <text x="100" y="133" font-size="15" font-weight="bold" fill="#EF6C00">MONTER LE LAB</text>
  <text x="100" y="151" font-size="11" fill="#888">3 h &#183; on part de zero</text>
  <line x1="62" y1="167" x2="263" y2="167" stroke="#EF6C00" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="62" y="186" font-size="10.5" fill="#333"><tspan font-weight="bold">00.1</tspan> Creer les 2 VM Hyper-V</text>
  <text x="62" y="204" font-size="10.5" fill="#333"><tspan font-weight="bold">00.2</tspan> Nommer, adresser, mettre a jour</text>
  <text x="62" y="222" font-size="10.5" fill="#333"><tspan font-weight="bold">00.3</tspan> Role AD DS + promouvoir DC01</text>
  <text x="62" y="240" font-size="10.5" fill="#333"><tspan font-weight="bold">00.4</tspan> Joindre et promouvoir DC2</text>
  <text x="62" y="252" font-size="10.5" fill="#333"><tspan font-weight="bold">00.5</tspan> VSCode + pare-feu</text>

  <!-- ETAPE 1 -->
  <rect x="345" y="105" width="245" height="150" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="377" cy="137" r="18" fill="#1565C0"/>
  <text x="377" y="144" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">1</text>
  <text x="405" y="133" font-size="15" font-weight="bold" fill="#1565C0">ACTIVE DIRECTORY</text>
  <text x="405" y="151" font-size="11" fill="#888">2 h</text>
  <line x1="367" y1="167" x2="568" y2="167" stroke="#1565C0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="367" y="188" font-size="11.5" fill="#333">Les OUs (les tiroirs)</text>
  <text x="367" y="208" font-size="11.5" fill="#333">Les groupes G_ et DL_ (AGDLP)</text>
  <text x="367" y="228" font-size="11.5" fill="#333">Les dossiers + permissions NTFS</text>
  <text x="367" y="247" font-size="11.5" fill="#333">Les utilisateurs</text>

  <!-- ETAPE 2 -->
  <rect x="650" y="105" width="245" height="150" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="682" cy="137" r="18" fill="#2E7D32"/>
  <text x="682" y="144" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">2</text>
  <text x="710" y="133" font-size="15" font-weight="bold" fill="#2E7D32">DFS</text>
  <text x="710" y="151" font-size="11" fill="#888">2 h</text>
  <line x1="672" y1="167" x2="873" y2="167" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="672" y="188" font-size="11.5" fill="#333">Partager les dossiers</text>
  <text x="672" y="208" font-size="11.5" fill="#333">Creer les espaces de noms</text>
  <text x="672" y="228" font-size="11.5" fill="#333">Repliquer DC01 vers DC2</text>
  <text x="672" y="247" font-size="11.5" fill="#333">Les dossiers personnels (H:)</text>

  <!-- ETAPE 3 -->
  <rect x="925" y="105" width="215" height="150" rx="14" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5" filter="url(#sh)"/>
  <circle cx="957" cy="137" r="18" fill="#6A1B9A"/>
  <text x="957" y="144" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">3</text>
  <text x="985" y="133" font-size="15" font-weight="bold" fill="#6A1B9A">GPO</text>
  <text x="985" y="151" font-size="11" fill="#888">1 h</text>
  <line x1="947" y1="167" x2="1118" y2="167" stroke="#6A1B9A" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="947" y="188" font-size="11.5" fill="#333">Script de connexion</text>
  <text x="947" y="208" font-size="11.5" fill="#333">Creer et lier la GPO</text>
  <text x="947" y="228" font-size="11.5" fill="#333">Deployer dans SYSVOL</text>
  <text x="947" y="247" font-size="11.5" fill="#333">Tester avec un vrai compte</text>

  <!-- FLECHES -->
  <line x1="285" y1="180" x2="340" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="590" y1="180" x2="645" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="895" y1="180" x2="920" y2="180" stroke="#555" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- DEUX PARCOURS -->
  <rect x="40" y="300" width="545" height="215" rx="14" fill="#fff" stroke="#1565C0" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="40" y="300" width="545" height="38" rx="14" fill="#1565C0"/>
  <rect x="40" y="320" width="545" height="18" fill="#1565C0"/>
  <text x="312" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">PARCOURS DEBUTANT &#8212; commencez ici par defaut</text>
  <text x="62" y="366" font-size="12" fill="#333">Vous tapez les commandes une par une et vous comprenez</text>
  <text x="62" y="386" font-size="12" fill="#333">chaque parametre. Aucun script a ecrire.</text>
  <rect x="62" y="402" width="501" height="44" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1"/>
  <text x="82" y="421" font-size="11.5" font-weight="bold" fill="#1565C0">Manuel = la procedure (la reponse)</text>
  <text x="82" y="438" font-size="11.5" font-weight="bold" fill="#1565C0">TP = les exercices (a vous de jouer)</text>
  <text x="62" y="472" font-size="11.5" fill="#333">Bloque plus de 10 minutes sur un exercice ?</text>
  <text x="62" y="492" font-size="11.5" fill="#333">Ouvrez le Manuel correspondant : c'est fait pour ca.</text>

  <rect x="625" y="300" width="515" height="215" rx="14" fill="#fff" stroke="#2E7D32" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="625" y="300" width="515" height="38" rx="14" fill="#2E7D32"/>
  <rect x="625" y="320" width="515" height="18" fill="#2E7D32"/>
  <text x="882" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">PARCOURS AVANCE &#8212; seulement si le debutant est fini</text>
  <text x="648" y="366" font-size="12" fill="#333">Vous ecrivez vous-meme un script PowerShell qui lit les CSV</text>
  <text x="648" y="386" font-size="12" fill="#333">et deploie les 30 utilisateurs automatiquement.</text>
  <rect x="648" y="402" width="470" height="44" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="668" y="421" font-size="11.5" font-weight="bold" fill="#2E7D32">TP-Avance = le cahier des charges</text>
  <text x="668" y="438" font-size="11.5" font-weight="bold" fill="#2E7D32">Explication-Script = la correction commentee</text>
  <text x="648" y="472" font-size="11.5" fill="#333">Prerequis : savoir faire une boucle foreach, une fonction,</text>
  <text x="648" y="492" font-size="11.5" fill="#333">et utiliser Import-Csv.</text>

  <!-- REGLE D'OR -->
  <rect x="40" y="545" width="1100" height="125" rx="14" fill="#FFEBEE" stroke="#C62828" stroke-width="2.5" filter="url(#sh)"/>
  <text x="65" y="575" font-size="15" font-weight="bold" fill="#C62828">Les 3 reflexes qui evitent 90% des galeres</text>
  <circle cx="90" cy="605" r="12" fill="#C62828"/><text x="90" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">1</text>
  <text x="110" y="603" font-size="11.5" font-weight="bold" fill="#333">Toujours en admin.</text>
  <text x="110" y="620" font-size="11.5" fill="#555">PowerShell lance en</text>
  <text x="110" y="637" font-size="11.5" fill="#555">simple utilisateur = echec.</text>
  <circle cx="450" cy="605" r="12" fill="#C62828"/><text x="450" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">2</text>
  <text x="470" y="603" font-size="11.5" font-weight="bold" fill="#333">Je verifie apres chaque etape.</text>
  <text x="470" y="620" font-size="11.5" fill="#555">Chaque exercice a un bloc Verification :</text>
  <text x="470" y="637" font-size="11.5" fill="#555">ne passez pas a la suite sans lui.</text>
  <circle cx="830" cy="605" r="12" fill="#C62828"/><text x="830" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">3</text>
  <text x="850" y="603" font-size="11.5" font-weight="bold" fill="#333">Je lis le message d'erreur.</text>
  <text x="850" y="620" font-size="11.5" fill="#555">Il dit presque toujours quel objet</text>
  <text x="850" y="637" font-size="11.5" fill="#555">manque ou quel chemin est faux.</text>
</svg>
