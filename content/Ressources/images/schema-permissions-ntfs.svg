<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/></filter>
  </defs>

  <rect width="850" height="480" fill="#FAFAFA" rx="15"/>
  <text x="425" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Permissions NTFS — Les 5 etapes</text>
  <text x="425" y="55" text-anchor="middle" font-size="12" fill="#888">Exemple sur le dossier C:\fournil\Laboratoire\fabrication\boulangerie</text>

  <!-- Étape 1 -->
  <rect x="30" y="80" width="155" height="160" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="57" cy="100" r="14" fill="#1565C0"/>
  <text x="57" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="white">1</text>
  <text x="110" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">Get-Acl</text>
  <text x="108" y="130" text-anchor="middle" font-size="9" fill="#555">Recuperer l'ACL</text>
  <text x="108" y="145" text-anchor="middle" font-size="9" fill="#555">actuelle du</text>
  <text x="108" y="160" text-anchor="middle" font-size="9" fill="#555">dossier</text>
  <rect x="45" y="175" width="125" height="50" rx="5" fill="white" stroke="#90CAF9"/>
  <text x="108" y="195" text-anchor="middle" font-size="8" fill="#888">Admin → FullControl</text>
  <text x="108" y="208" text-anchor="middle" font-size="8" fill="#888">Users → Read</text>
  <text x="108" y="221" text-anchor="middle" font-size="8" fill="#888">(herite du parent)</text>

  <!-- Étape 2 -->
  <rect x="200" y="80" width="155" height="160" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="227" cy="100" r="14" fill="#E65100"/>
  <text x="227" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="white">2</text>
  <text x="290" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Desactiver</text>
  <text x="278" y="130" text-anchor="middle" font-size="9" fill="#555">SetAccessRule</text>
  <text x="278" y="145" text-anchor="middle" font-size="9" fill="#555">Protection</text>
  <text x="278" y="160" text-anchor="middle" font-size="9" fill="#555">($true, $false)</text>
  <text x="278" y="190" text-anchor="middle" font-size="9" fill="#E65100" font-weight="bold">$true =</text>
  <text x="278" y="205" text-anchor="middle" font-size="8" fill="#555">couper l'heritage</text>
  <text x="278" y="222" text-anchor="middle" font-size="9" fill="#E65100" font-weight="bold">$false =</text>
  <text x="278" y="237" text-anchor="middle" font-size="8" fill="#555">ne rien garder</text>

  <!-- Étape 3 -->
  <rect x="370" y="80" width="155" height="160" rx="10" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="397" cy="100" r="14" fill="#C62828"/>
  <text x="397" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="white">3</text>
  <text x="455" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Vider l'ACL</text>
  <text x="448" y="130" text-anchor="middle" font-size="9" fill="#555">RemoveAccess</text>
  <text x="448" y="145" text-anchor="middle" font-size="9" fill="#555">Rule sur</text>
  <text x="448" y="160" text-anchor="middle" font-size="9" fill="#555">chaque entree</text>
  <rect x="385" y="175" width="125" height="50" rx="5" fill="white" stroke="#EF9A9A"/>
  <text x="448" y="195" text-anchor="middle" font-size="9" fill="#C62828" font-weight="bold">ACL VIDE</text>
  <text x="448" y="212" text-anchor="middle" font-size="8" fill="#888">Aucune permission</text>

  <!-- Étape 4 -->
  <rect x="540" y="80" width="155" height="160" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="567" cy="100" r="14" fill="#2E7D32"/>
  <text x="567" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="white">4</text>
  <text x="625" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">Ajouter</text>
  <text x="618" y="130" text-anchor="middle" font-size="9" fill="#555">AddAccessRule</text>
  <text x="618" y="145" text-anchor="middle" font-size="9" fill="#555">avec FileSystem</text>
  <text x="618" y="160" text-anchor="middle" font-size="9" fill="#555">AccessRule</text>
  <rect x="555" y="175" width="125" height="50" rx="5" fill="white" stroke="#A5D6A7"/>
  <text x="618" y="192" text-anchor="middle" font-size="8" fill="#2E7D32">+ Administrateurs</text>
  <text x="618" y="205" text-anchor="middle" font-size="8" fill="#2E7D32">+ SYSTEM</text>
  <text x="618" y="218" text-anchor="middle" font-size="8" fill="#2E7D32">+ DL_L + DL_M</text>

  <!-- Étape 5 -->
  <rect x="710" y="80" width="120" height="160" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="737" cy="100" r="14" fill="#7B1FA2"/>
  <text x="737" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="white">5</text>
  <text x="770" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">Appliquer</text>
  <text x="770" y="135" text-anchor="middle" font-size="10" fill="#555">Set-Acl</text>
  <text x="770" y="165" text-anchor="middle" font-size="9" fill="#555">Ecrit les</text>
  <text x="770" y="180" text-anchor="middle" font-size="9" fill="#555">permissions</text>
  <text x="770" y="195" text-anchor="middle" font-size="9" fill="#555">sur le</text>
  <text x="770" y="210" text-anchor="middle" font-size="9" fill="#555">dossier</text>

  <!-- Résultat final -->
  <rect x="30" y="270" width="800" height="190" rx="12" fill="white" stroke="#DDD" filter="url(#sh)"/>
  <text x="430" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Resultat : permissions du dossier boulangerie</text>

  <rect x="60" y="315" width="740" height="30" rx="5" fill="#E8EAF6" stroke="#5C6BC0"/>
  <text x="80" y="335" font-size="10" font-weight="bold" fill="#5C6BC0">Qui</text>
  <text x="380" y="335" font-size="10" font-weight="bold" fill="#5C6BC0">Droit</text>
  <text x="620" y="335" font-size="10" font-weight="bold" fill="#5C6BC0">Heritage</text>

  <rect x="60" y="348" width="740" height="25" rx="3" fill="#FAFAFA"/>
  <text x="80" y="365" font-size="10" fill="#333">BUILTIN\Administrateurs</text>
  <text x="380" y="365" font-size="10" fill="#333">FullControl (Controle total)</text>
  <text x="620" y="365" font-size="10" fill="#333">Sous-dossiers + Fichiers</text>

  <rect x="60" y="375" width="740" height="25" rx="3" fill="white"/>
  <text x="80" y="392" font-size="10" fill="#333">NT AUTHORITY\SYSTEM</text>
  <text x="380" y="392" font-size="10" fill="#333">FullControl (Controle total)</text>
  <text x="620" y="392" font-size="10" fill="#333">Sous-dossiers + Fichiers</text>

  <rect x="60" y="402" width="740" height="25" rx="3" fill="#FFF3E0"/>
  <text x="80" y="419" font-size="10" fill="#E65100" font-weight="bold">DL_Labo_fab_boulangerie_L</text>
  <text x="380" y="419" font-size="10" fill="#E65100">ReadAndExecute (Lecture)</text>
  <text x="620" y="419" font-size="10" fill="#333">Sous-dossiers + Fichiers</text>

  <rect x="60" y="429" width="740" height="25" rx="3" fill="#E8F5E9"/>
  <text x="80" y="446" font-size="10" fill="#2E7D32" font-weight="bold">DL_Labo_fab_boulangerie_M</text>
  <text x="380" y="446" font-size="10" fill="#2E7D32">Modify (Modification)</text>
  <text x="620" y="446" font-size="10" fill="#333">Sous-dossiers + Fichiers</text>
</svg>
