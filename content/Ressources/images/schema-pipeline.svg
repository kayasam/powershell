<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Un pipeline transporte des objets entre les cmdlets</title>
  <desc id="desc">Get-Service produit des objets service. Where-Object garde les services actifs, Sort-Object les classe, puis Select-Object choisit les propriétés du résultat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#77d9f6"/></marker>
  </defs>
  <rect width="900" height="300" rx="22" fill="#101b2d"/>
  <text x="36" y="45" fill="#f4f8ff" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">Le pipeline : des objets en voyage</text>
  <text x="36" y="73" fill="#acc3d9" font-family="Segoe UI, system-ui, sans-serif" font-size="15">Chaque commande reçoit des objets, pas une copie de l'écran.</text>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="36" y="115" width="178" height="104" rx="14" fill="#203d63" stroke="#62b8ed" stroke-width="2"/>
    <text x="52" y="148" fill="#ffffff" font-size="19" font-weight="700">Get-Service</text>
    <text x="52" y="176" fill="#d1e5f5" font-size="14">Produit des services</text>
    <text x="52" y="198" fill="#d1e5f5" font-size="14">avec leurs propriétés</text>
    <rect x="256" y="115" width="178" height="104" rx="14" fill="#215453" stroke="#49d4c7" stroke-width="2"/>
    <text x="272" y="148" fill="#ffffff" font-size="19" font-weight="700">Where-Object</text>
    <text x="272" y="176" fill="#d8f9f2" font-size="14">Garde seulement</text>
    <text x="272" y="198" fill="#d8f9f2" font-size="14">Status = Running</text>
    <rect x="476" y="115" width="178" height="104" rx="14" fill="#49417a" stroke="#b5a0ff" stroke-width="2"/>
    <text x="492" y="148" fill="#ffffff" font-size="19" font-weight="700">Sort-Object</text>
    <text x="492" y="176" fill="#e8e2ff" font-size="14">Classe les objets</text>
    <text x="492" y="198" fill="#e8e2ff" font-size="14">par Name</text>
    <rect x="696" y="115" width="168" height="104" rx="14" fill="#6a4427" stroke="#ffc36f" stroke-width="2"/>
    <text x="712" y="148" fill="#ffffff" font-size="19" font-weight="700">Select-Object</text>
    <text x="712" y="176" fill="#ffe9cf" font-size="14">Choisit Name</text>
    <text x="712" y="198" fill="#ffe9cf" font-size="14">et Status</text>
    <text x="215" y="154" fill="#77d9f6" font-size="13" font-weight="700">|</text>
    <text x="435" y="154" fill="#77d9f6" font-size="13" font-weight="700">|</text>
    <text x="655" y="154" fill="#77d9f6" font-size="13" font-weight="700">|</text>
  </g>
  <g fill="none" stroke="#77d9f6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M217 169H249"/><path d="M437 169H469"/><path d="M657 169H689"/>
  </g>
  <text x="36" y="260" fill="#f4d08f" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600">À retenir : filtrer et trier avant de formater ou exporter.</text>
</svg>
