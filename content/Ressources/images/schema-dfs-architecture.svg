<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="1000" height="550" fill="#FAFAFA" rx="15"/>

  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Architecture DFS — Comment l'utilisateur accede aux fichiers</text>

  <!-- UTILISATEUR -->
  <rect x="30" y="80" width="180" height="120" rx="15" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#sh)"/>
  <text x="120" y="115" text-anchor="middle" font-size="30">&#128100;</text>
  <text x="120" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Utilisateur</text>
  <text x="120" y="163" text-anchor="middle" font-size="10" fill="#555">mlebrun</text>
  <text x="120" y="180" text-anchor="middle" font-size="9" fill="#888">Poste client</text>

  <!-- Flèche utilisateur → DFS -->
  <line x1="210" y1="140" x2="280" y2="140" stroke="#1565C0" stroke-width="2" marker-end="url(#ar)"/>
  <text x="245" y="132" text-anchor="middle" font-size="9" fill="#1565C0">accede a</text>

  <!-- NAMESPACE DFS -->
  <rect x="285" y="65" width="350" height="155" rx="15" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#sh)"/>
  <text x="460" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Espace de noms DFS</text>
  <text x="460" y="112" text-anchor="middle" font-size="11" fill="#555">Chemin unique et transparent</text>

  <rect x="305" y="125" width="310" height="28" rx="6" fill="white" stroke="#A5D6A7"/>
  <text x="460" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">\\ad.fournil.lab\Laboratoire\fabrication</text>

  <rect x="305" y="158" width="310" height="28" rx="6" fill="white" stroke="#A5D6A7"/>
  <text x="460" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">\\ad.fournil.lab\Vente\boutique</text>

  <rect x="305" y="191" width="310" height="22" rx="6" fill="#E8F5E9" stroke="#C8E6C9" stroke-dasharray="3,2"/>
  <text x="460" y="207" text-anchor="middle" font-size="9" fill="#888">\\ad.fournil.lab\HOMES\Laboratoire\mlebrun</text>

  <!-- Flèches DFS → Serveurs -->
  <line x1="635" y1="120" x2="710" y2="90" stroke="#2E7D32" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="635" y1="170" x2="710" y2="250" stroke="#2E7D32" stroke-width="2" marker-end="url(#ar2)"/>

  <text x="690" y="140" text-anchor="middle" font-size="9" fill="#2E7D32" transform="rotate(-20, 690, 140)">cible 1</text>
  <text x="690" y="210" text-anchor="middle" font-size="9" fill="#2E7D32" transform="rotate(20, 690, 210)">cible 2</text>

  <!-- DC01 -->
  <rect x="715" y="50" width="250" height="120" rx="12" fill="#FFF8E1" stroke="#F9A825" stroke-width="2" filter="url(#sh)"/>
  <text x="840" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#F57F17">DC01 (principal)</text>
  <text x="840" y="98" text-anchor="middle" font-size="10" fill="#555">DFSn + DFSr</text>
  <rect x="730" y="108" width="220" height="22" rx="4" fill="white" stroke="#FFF176"/>
  <text x="840" y="124" text-anchor="middle" font-size="9" fill="#666">C:\fournil\Laboratoire\fabrication</text>
  <rect x="730" y="134" width="220" height="22" rx="4" fill="white" stroke="#FFF176"/>
  <text x="840" y="150" text-anchor="middle" font-size="9" fill="#666">fabrication$ (partage cache)</text>

  <!-- DC2 -->
  <rect x="715" y="210" width="250" height="120" rx="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" filter="url(#sh)"/>
  <text x="840" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B1FA2">DC2 (replica)</text>
  <text x="840" y="258" text-anchor="middle" font-size="10" fill="#555">DFSr uniquement</text>
  <rect x="730" y="268" width="220" height="22" rx="4" fill="white" stroke="#CE93D8"/>
  <text x="840" y="284" text-anchor="middle" font-size="9" fill="#666">C:\fournil\Laboratoire\fabrication</text>
  <rect x="730" y="294" width="220" height="22" rx="4" fill="white" stroke="#CE93D8"/>
  <text x="840" y="310" text-anchor="middle" font-size="9" fill="#666">fabrication$ (partage cache)</text>

  <!-- Réplication DC01 ↔ DC2 -->
  <rect x="935" y="160" width="50" height="60" rx="8" fill="#E0E0E0" stroke="#9E9E9E"/>
  <text x="960" y="183" text-anchor="middle" font-size="18">&#128260;</text>
  <text x="960" y="212" text-anchor="middle" font-size="7" fill="#666">DFSr</text>
  <line x1="960" y1="160" x2="960" y2="145" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="960" y1="220" x2="960" y2="235" stroke="#9E9E9E" stroke-width="1.5"/>

  <!-- Section basse : explication -->
  <rect x="30" y="360" width="940" height="170" rx="12" fill="white" stroke="#DDD" filter="url(#sh)"/>
  <text x="50" y="390" font-size="14" font-weight="bold" fill="#333">Comment ca marche ?</text>

  <text x="50" y="418" font-size="11" fill="#555">1. L'utilisateur ouvre</text>
  <text x="210" y="418" font-size="11" font-weight="bold" fill="#2E7D32">\\ad.fournil.lab\Laboratoire\fabrication</text>

  <text x="50" y="440" font-size="11" fill="#555">2. DFS redirige vers le serveur le plus proche :</text>
  <text x="385" y="440" font-size="11" font-weight="bold" fill="#F57F17">\\DC01\fabrication$</text>
  <text x="560" y="440" font-size="11" fill="#555">ou</text>
  <text x="585" y="440" font-size="11" font-weight="bold" fill="#7B1FA2">\\DC2\fabrication$</text>

  <text x="50" y="462" font-size="11" fill="#555">3. Si DC01 tombe en panne, DFS bascule automatiquement sur DC2 (et inversement)</text>

  <text x="50" y="490" font-size="11" fill="#555">4. DFSr synchronise les fichiers entre les deux serveurs en temps reel</text>

  <text x="50" y="518" font-size="11" font-weight="bold" fill="#1565C0">L'utilisateur ne sait meme pas sur quel serveur il est — le chemin DFS est toujours le meme.</text>
</svg>
